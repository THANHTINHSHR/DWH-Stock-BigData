apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "informer-chart.fullname" . }}-train-job
  labels:
    app.kubernetes.io/name: {{ include "informer-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: train
    app.kubernetes.io/part-of: informer
spec:
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trigger-trainer
    spec:
      containers:
        - name: trainer-job
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["python3"]
          args: ["core/streaming/informerAI/train/ai_ticker_trainer.py"]

          volumeMounts:
            - name: model-storage
              mountPath: core/streaming/informerAI/files
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secret
          env:
            - name: STREAM_TYPES
              value: "{{ .Values.env.core.STREAM_TYPES }}"
            - name: AWS_DEFAULT_REGION
              value: "{{ .Values.env.aws.AWS_DEFAULT_REGION }}"
            - name: BUCKET_NAME
              value: "{{ .Values.env.aws.BUCKET_NAME }}"
            - name: ROOT_DB
              value: "{{ .Values.env.aws.ROOT_DB }}"
            - name: ATHENA_DB
              value: "{{ .Values.env.aws.ATHENA_DB }}"
            - name: S3_STAGING_DIR
              value: "{{ .Values.env.aws.S3_STAGING_DIR }}"
            - name: GRAFANA_URL
              value: "{{ .Values.env.grafana.GRAFANA_URL }}"
            - name: GRAFANA_DB_URL
              value: "{{ .Values.env.grafana.GRAFANA_DB_URL }}"
            - name: INFLUXDB_URL
              value: "{{ .Values.env.influxdb.INFLUXDB_URL }}"
            - name: INFLUXDB_ORG
              value: "{{ .Values.env.influxdb.INFLUXDB_ORG }}"
            - name: INFLUXDB_BUCKET
              value: "{{ .Values.env.influxdb.INFLUXDB_BUCKET }}"
            - name: SUPERSET_URL
              value: "{{ .Values.env.superset.SUPERSET_URL }}"
            - name: AI_APP_NAME
              value: "{{ .Values.env.informer.AI_APP_NAME }}"
            - name: REPARTITION
              value: "{{ .Values.env.informer.REPARTITION }}"
            - name: TRAIN_RATIO
              value: "{{ .Values.env.informer.TRAIN_RATIO }}"
            - name: VAL_RATIO
              value: "{{ .Values.env.informer.VAL_RATIO }}"
            - name: BATCH_SIZE
              value: "{{ .Values.env.informer.BATCH_SIZE }}"
            - name: N_DAYS_AGO
              value: "{{ .Values.env.informer.N_DAYS_AGO }}"
            - name: MAX_DIRECTORIES
              value: "{{ .Values.env.informer.MAX_DIRECTORIES }}"
            - name: SEQUENCE_LENGTH
              value: "{{ .Values.env.informer.SEQUENCE_LENGTH }}"
            - name: PREDICTION_LENGTH
              value: "{{ .Values.env.informer.PREDICTION_LENGTH }}"
            - name: NUM_EPOCHS
              value: "{{ .Values.env.informer.NUM_EPOCHS }}"

      restartPolicy: Never
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: {{ include "informer-chart.fullname" . }}-pvc
