apiVersion: v1
kind: Secret
metadata:
  name: influxdb-secret
type: Opaque
data:
  docker_influxdb_init_username: {{ .Values.secrets.docker_influxdb_init_username | b64enc }}
  docker_influxdb_init_password: {{ .Values.secrets.docker_influxdb_init_password | b64enc }}
  docker_influxdb_init_admin_token: {{ .Values.secrets.docker_influxdb_init_admin_token | b64enc }}
